<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="FunkoPop- Capstone Project.css">
    <script src="FunkoPop-Capstone Project.js" defer></script>
    <script src="FunkoPopServer.js" defer></script>
    <meta charset="utf-8">
    <img src="FunkoPop Trading Near You Logo.png" alt="FunkoPop Trading Logo" width="100%" height="250">
    <title>FunkoPop Trading Near You- User Profile</title>
    
</head>
<body>
<u><h3 style="text-align: center;">Tradeable Pops Near You</h3></u>
<iframe 
        src="https://google.com" 
        width="1000" 
        height="450" 
        style="border:0;" 
        allowfullscreen="" 
        loading="lazy" 
        referrerpolicy="no-referrer-when-downgrade">
</iframe>
<ul id="user-list"></ul>
<!--User Online Status-->
<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();

    const currentUserId = 1; 
    socket.emit('user-authenticated', currentUserId);

    const directory = document.getElementById('user-list');

    // Receive the full list of users from SQLite
    socket.on('status-update', (users) => {
        directory.innerHTML = ''; 

        users.forEach(user => {
            const li = document.createElement('li');
            
            if (user.is_online === 1) {
                li.innerHTML = `🟢 <strong>${user.username}</strong> (Online)`;
            } else {
                const timeLabel = user.last_seen ? `Last seen: ${user.last_seen}` : 'Offline';
                li.innerHTML = `🔴 <strong>${user.username}</strong> (${timeLabel})`;
            }
            
            directory.appendChild(li);
        });
    });
</script>
</body>
</html>
