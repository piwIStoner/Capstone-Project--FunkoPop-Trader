    <ul id="funkoList" class="funkoList"></ul>
<!--Saved Funko Pop List-->
<script>
const input = document.getElementById('funkoInput');
const save = document.getElementById('savedInput');
const list = document.getElementById('funkoList');

let items = JSON.parse(localStorage.getItem('savedFunko')) || [];

function renderList() {
    list.innerHTML='';
    items.forEach(text => {
        const li = document.createElement('li');
        li.textContent = text;
        list.appendChild(li);
    })
}

renderList();

save.addEventListener('click', function() {
    if (input.value.trim() !== '') {
        items.push(input.value);
        localStorage.setItem('savedFunko', JSON.stringify(items));
        renderList();
        input.value = '';
    }
});
