<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="FunkoPop- Capstone Project.css">
    <script src="FunkoPop-Capstone Project.js" defer></script>
    <script src="FunkoPopServer.js" defer></script>
    <meta charset="utf-8">
    <img src="FunkoPop Trading Near You Logo.png" alt="FunkoPop Trading Logo" width="100%" height="250">
    <title>FunkoPop Trading Near You- Create New User</title>
</head>
<body>
<h2>Create New User</h2>
<form id="registerForm" method="POST">
<div class="CreateUserNameContainer">
    <label for="CreateUserName">Create Username:</label>
    <input type="text" id="InputUserName" name="Username" placeholder="JohnDoe123">
</div>
<br>
<div class="CreatePasswordContainer">
    <label for="CreatePassword">Create Password:</label>
    <input type="text" id="InputPassword" name="Password" placeholder="ABC123">
</div>
<br>
<div class="EnterBirthDate">
    <label for="EnterBirthDate">Birth Date:</label>
    <input type="text" id="EnterBirthday" name="Birthday" placeholder="01/01/1990">
</div>
<br>
<div class="EnterAge">
    <label for="EnterAge">Age:</label>
    <input type="number" id="EnterAge" name="Age" placeholder="18">
</div>
<br>
<div class="UserEmail">
    <label for="UserEmail">User Email:</label>
    <input type="text" id="UserEmail" name="Email" placeholder="JohnDoe123@gmail.com">
</div>
<div id="ParentalEmail" style="display:none;">
    <label for="ParentalEmail">Parental Email:</label>
    <input type="text" id="ParentalEmail" name="ParentalEmail" placeholder="BestDad123@gmail.com">
</div>
<!--chatGPT Determine user age for parental email-->
<script>
    const EnterAge = document.getElementById("EnterAge");
    const ParentalEmail = document.getElementById("ParentalEmail");

    EnterAge.addEventListener("input", () => {
        if (Number(EnterAge.value) < 15) {
            ParentalEmail.style.display = "flex";
        } else {
            ParentalEmail.style.display = "none";
        }
    });
</script>
<!--chatGPT Determine user age for parental email-->
<br>
<div class="BO">
    <button type="submit" id="createNewUser">
        Submit
    </button>
</div>
</form>
</body>
</html>
